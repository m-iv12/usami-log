name: 配信データ更新

on:
  schedule:
    - cron: "7,37 * * * *"   # 30分ごと（GitHub の混雑で数分〜十数分遅れることがある）
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "全件を取り直す（1 で有効）"
        default: "0"
  issues:
    types: [opened, reopened]   # ページの「追加」ボタンから（失敗したものは Issue を Reopen するとやり直す）
  push:
    branches: [main]         # 手でファイルを直したとき

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

# 自動更新どうしは1つずつ順番に実行する。ポストの追加は1件ずつ別に実行する
# （同じグループに入れると、待ちが2件以上になったときに古い待ちが取り消され、追加が消えるため）
# 同時に実行して保存がぶつかった場合は、save.sh が最新の状態からやり直す
concurrency:
  group: update-${{ github.event_name == 'issues' && github.event.issue.number || 'auto' }}
  cancel-in-progress: false

jobs:
  update:
    # Issue はリポジトリの持ち主が作った「[追加]」だけを受け付ける
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[追加]'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # 待っている間にほかの実行が保存した分も含めた、最新の状態から始める
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 処理のプログラムは8人共通のもの（mechatua-log/common/）を毎回取ってきて使う。取れなかったときは手元のものを使う
      - name: Get shared scripts
        run: |
          base=https://raw.githubusercontent.com/${{ github.repository_owner }}/mechatua-log/main/common
          mkdir -p /tmp/shared
          for f in fetch_streams.py add_item.py; do
            if curl -fsSL "$base/$f" -o "/tmp/shared/$f"; then cp "/tmp/shared/$f" "$f"; echo "共通の $f を使用"; else echo "共通の $f を取得できなかったため手元のものを使用"; fi
          done
          for f in save.sh pending.py; do
            curl -fsSL "$base/$f" -o "/tmp/shared/$f" || echo "共通の $f を取得できませんでした"
          done

      - name: Add item from issue
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python add_item.py

      # 開いたままの「[追加]」Issue（失敗・取り消しで登録されなかったもの）を、自動更新のたびにまとめて登録する
      - name: Add items from open issues
        if: github.event_name != 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/shared/pending.py ]; then python /tmp/shared/pending.py add; fi

      - name: Fetch streams
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FULL_REFRESH: ${{ github.event.inputs.full_refresh || '0' }}
        run: python fetch_streams.py

      - name: Commit
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          IS_ISSUE: ${{ github.event_name == 'issues' && '1' || '0' }}
        run: |
          if [ -f /tmp/shared/save.sh ]; then
            bash /tmp/shared/save.sh
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A *.json
            git diff --cached --quiet || git commit -m "配信データを更新"
            git checkout -- fetch_streams.py add_item.py
            git pull --rebase
            git push
          fi

      - name: Close added issues
        if: github.event_name != 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/shared/pending.py ]; then python /tmp/shared/pending.py close; fi

      - name: Close issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "反映しました。数分後にカレンダーに表示されます。"

      - name: Report failure
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "登録に失敗しました。Actions タブのログを確認してください。"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true   # 同時に公開が重なって失敗しても、データは保存済みで次の更新で公開される
