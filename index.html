<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title></title>
</head>
<body>
<!-- 画面の中身は8人共通の ../mechatua-log/common/member.html を読み込んで表示する。
     見た目や機能を直すときは member.html だけを直せば、8人全員に反映される。
     このページの配信データ（streams.json・config.json など）はこのリポジトリのものを使う。 -->
<p id="loading" style="font-family:sans-serif;color:#888;padding:20px">読み込み中…</p>
<script>
fetch("../mechatua-log/common/member.html",{cache:"no-cache"})
  .then(function(r){if(!r.ok)throw new Error(r.status);return r.text()})
  .then(function(html){document.open();document.write(html);document.close()})
  .catch(function(){document.getElementById("loading").textContent="画面を読み込めませんでした。時間をおいて再読み込みしてください。"});
</script>
</body>
</html>
